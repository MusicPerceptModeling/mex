benchmark:
  task: RepetitionDecreaseTask
  midm: [
    'cache/metrics/salami_pa-audioic_ic-0.0-0.3-0.5',
    'cache/metrics/salami_pa-audioic_entropy_mc32_nruns1_0.0-0.3-0.5',
    'cache/metrics/salami_audioic_entropy_mc32',
    'cache/metrics/salami_audioic_ic'
  ]
  metadata: SalamiMetaData
  task_kwargs:
    periode_frames: 0.0928798185941
    time_offset_frame: 1 # for IC 1 for entropy 0 #TODO: handle this for running multiples
    normalize: true
    exclude_segments: ['Z', 'Silence', 'End', 'no_function']
    merge_variations: false
    num_proc: 5
    repetition_modes: [['all'], ['first'],] # 'all', 'first' and 'contiguous' can be combined, e.g ['contiguous', 'first']
  out_path: "benchmarks.parquet"