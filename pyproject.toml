[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mex"
version = "0.1.0"
description = "Musical Expectation (MEX) benchmark suite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "datasets",
  "einops",
  "jsonargparse",
  "mir_eval",
]

[project.optional-dependencies]

all = [
    "mex[baselines]",
    "mex[extras]",
    "mex[dev]",
    "mex[demo]",
]

baselines = [
  "audioic @ git+https://github.com/SonyCSLParis/audioic@entropy",
  "pa-audioic @ git+https://github.com/CPJKU/pa-audioic@entropy",
 ]

extras = [
  "pyfluidsynth",
  "pretty-midi",
  "tqdm",
  "soundfile",
]

dev = [
  "pytest",
  "pre-commit",
  "pyyaml",
]

demo = [
  "ipykernel"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mex*"]
