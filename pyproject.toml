[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-benchmark-suite"
version = "0.1.0"
description = "IC benchmark suite with repetition-vs-IC evaluation utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
]

[project.optional-dependencies]
baselines = [
  "audioic",
  "pa-audioic @ git+https://github.com/CPJKU/pa-audioic",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ic_benchmark_suite*"]
