[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mex"
version = "0.1.0"
description = "Musical Expectation (MEX) benchmark suite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.1.0",
  "scipy==1.18.1",
  "datasets>=4.8.3,<5",
  "einops==0.8.2",
  "jsonargparse==4.53.0",
  "mir_eval==0.8.2",
  "pretty_midi==0.2.11.post0",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "mne==1.13.2",
  "mtrf==2.1.2",
]

[project.optional-dependencies]

all = [
    "mex[baselines]",
    "mex[extras]",
    "mex[dev]",
    "mex[demo]",
]

baselines = [
  "audioic @ git+https://github.com/SonyCSLParis/audioic@entropy",
  "pa-audioic @ git+https://github.com/CPJKU/pa-audioic@entropy",
 ]

extras = [
  "pyfluidsynth",
  "pretty-midi==0.2.11.post0",
  "tqdm==4.70.1",
  "soundfile==0.14.0",
]

dev = [
  "pytest==9.1.1",
  "pre-commit==4.7.0",
  "pyyaml==6.0.3",
]

demo = [
  "ipykernel==7.4.0"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["mex*"]
