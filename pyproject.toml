[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-benchmark-suite"
version = "0.1.0"
description = "IC benchmark suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "datasets",
  "einops",
  "jsonargparse",
]

[project.optional-dependencies]

all = [
    "ic-benchmark-suite[baselines]",
    "ic-benchmark-suite[extras]",
    "ic-benchmark-suite[tests]",
    "ic-benchmark-suite[demo]",
]

baselines = [
  "audioic @ git+https://github.com/SonyCSLParis/audioic",
  "pa-audioic @ git+https://github.com/CPJKU/pa-audioic@entropy",
 ]

extras = [
  "pyfluidsynth",
  "pretty-midi",
  "tqdm",
  "soundfile",
]

tests = [
  "pytest"
]

demo = [
  "ipykernel"
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ic_benchmark_suite*"]
